name: pattern-integration
services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pattern_test
      POSTGRES_USER: pattern_test
      POSTGRES_PASSWORD: pattern_test_local
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pattern_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pattern_test -d pattern_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pattern_test_db:
