services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pattern
      POSTGRES_USER: pattern
      POSTGRES_PASSWORD: pattern
    ports:
      - "5433:5432"
    volumes:
      - pattern_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pattern -d pattern"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pattern_db:
